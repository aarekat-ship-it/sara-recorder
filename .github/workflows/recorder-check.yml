name: Recorder data checks
on:
  pull_request:
    paths: ['worlds-recording.json', 'tests/**', '.github/workflows/recorder-check.yml']
permissions:
  contents: read
jobs:
  recorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: node --test tests/d153.test.mjs
